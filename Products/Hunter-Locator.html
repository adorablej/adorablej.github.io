<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hunter Korea | Hunter Engineering Company®</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link href="/css/common.css?v=20260814" rel="stylesheet" />
    <link href="/css/layout.css?v=20260814" rel="stylesheet" />
    <link href="/css/main.css?v=20260814" rel="stylesheet" />
    <link href="/css/common-form.css?v=20260814" rel="stylesheet" />
    <link href="/css/products.css?v=20260814" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
</head>

<body class="sub-pride-map-page">
    <!-- header -->
    <div data-include="/includes/header.html"></div>

    <main id="main" class="products-page">
        <section class="page-heading">
            <div class="inner">
                <ul class="breadcrumb">
                    <li><a href="/" class="breadcrumb-home" aria-label="Home"></a></li>
                    <li><a href="/products.html">Products</a></li>
                    <li><a href="#">Hunter Locator</a></li>
                </ul>
                <h2 class="page-title">Hunter Locator</h2>
            </div>
        </section>

        <!-- products-HunterPride-Map.html , Store Map. -->
        <section class="sub-pride-map">
            <div class="sub-pride-map-bg">
                <div id="naverStoreMap" role="application" aria-label="헌터 설치 매장 지도" style="width: 100%; height: 100%;"></div>
            </div>

            <div class="sub-pride-map-panel">
                <div class="sub-pride-map-search">
                    <h3 class="sub-pride-map-title">헌터 설치 매장 안내<span>.</span></h3>

                    <label class="sub-pride-map-keyword sub-form-group">
                        <span class="sub-pride-map-search-icon" aria-hidden="true"></span>
                        <input type="search" class="sub-form-input" placeholder="매장명을 입력해주세요.">
                    </label>

                    <div class="sub-pride-map-selects">
                        <div class="sub-form-select" data-select data-store-select="region">
                            <button type="button" class="sub-form-select-trigger" aria-expanded="false" aria-haspopup="listbox">
                                <span class="sub-form-select-value is-placeholder">도/시 선택</span>
                                <span class="sub-form-select-arrow" aria-hidden="true"></span>
                            </button>
                            <ul class="sub-form-select-options" role="listbox">
                                <li><button type="button" class="sub-form-select-option is-selected" data-value="">도/시 선택</button></li>
                            </ul>
                            <input type="hidden" value="">
                        </div>
                        <div class="sub-form-select is-disabled" data-select data-store-select="city">
                            <button type="button" class="sub-form-select-trigger" aria-expanded="false" aria-haspopup="listbox" disabled>
                                <span class="sub-form-select-value is-placeholder">시/구/군 선택</span>
                                <span class="sub-form-select-arrow" aria-hidden="true"></span>
                            </button>
                            <ul class="sub-form-select-options" role="listbox">
                                <li><button type="button" class="sub-form-select-option is-selected" data-value="">시/구/군 선택</button></li>
                            </ul>
                            <input type="hidden" value="" disabled>
                        </div>
                    </div>

                    <p class="sub-pride-map-count">총 <strong>0</strong>개의 매장이 있습니다.</p>
                    <div class="sub-pride-store-list"></div>
                </div>

                <aside class="sub-pride-store-detail" aria-hidden="true">
                    <button type="button" class="modal-close-button sub-pride-store-close" aria-label="상세정보 닫기"></button>
                    <div class="sub-pride-store-photo"></div>
                    <div class="sub-pride-store-detail-content">
                        <span class="sub-pride-store-region"></span>
                        <h4></h4>
                        <dl class="sub-pride-store-meta"></dl>
                        <div class="sub-pride-store-products">
                            <h5>보유 헌터 제품</h5>
                            <ul></ul>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <!-- footer -->
    <div class="footer-section" data-header-theme="dark" data-include="/includes/footer.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.8/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/js/include.js?v=20260814"></script>
    <script src="/js/common.js?v=20260814"></script>
    <script src="/js/main.js?v=20260814"></script>
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=rq673gym23"></script>
    <script src="/js/api/config.js?v=20260814"></script>
    <script src="/js/api/client.js?v=20260814"></script>
    <script src="/js/api/front-api.js?v=20260814"></script>
    <script src="/js/store/mock-store.js?v=20260814"></script>
    <script src="/js/store/store-api.js?v=20260814"></script>
    <script src="/js/store/store-ui.js?v=20260814-1"></script>
    <script src="/js/form.js?v=20260814"></script>
    <script src="/js/products.js?v=20260814"></script>
</body>

</html>
