<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>로그인 | 헌터코리아</title>
    <link href="/css/common.css" rel="stylesheet" />
    <link href="/css/layout.css" rel="stylesheet" />
    <link href="/css/common-form.css" rel="stylesheet" />
    <link href="/css/account.css" rel="stylesheet" />
    <link href="/css/responsive.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&amp;display=swap" rel="stylesheet"/>

</head>
<body>
    <div data-include="/includes/header.html"></div>

    <main class="sub-account-page" data-header-theme="dark">
        <section class="sub-account-section sub-account-login-section" aria-labelledby="login-title">
            <div class="sub-account-container sub-account-container-small">
                <h1 class="sub-account-title" id="login-title">Login<span>.</span></h1>

                <form class="sub-form sub-account-form" id="login-form" data-form novalidate>
                    <div class="sub-form-group sub-account-field">
                        <label class="sub-account-label" for="login-phone">휴대전화번호</label>
                        <input
                            class="sub-form-input sub-account-input"
                            id="login-phone"
                            name="phone"
                            type="tel"
                            inputmode="numeric"
                            autocomplete="tel"
                            maxlength="13"
                            data-phone
                            placeholder="(-) 제외한 숫자만 입력해 주세요."
                            data-required
                            data-message="휴대전화번호를 입력해 주세요."
                        />
                        <p class="sub-form-message sub-account-error" aria-live="polite"></p>
                    </div>

                    <label class="sub-form-checkbox sub-account-login-check">
                        <input id="login-keep" name="keepLogin" type="checkbox" checked />
                        <span class="sub-form-checkbox-icon" aria-hidden="true"></span>
                        <span class="sub-form-checkbox-text">로그인 상태 유지</span>
                    </label>

                    <div class="sub-account-actions">
                        <button class="sub-account-button sub-account-button-primary" type="submit">로그인</button>
                        <a class="sub-account-button sub-account-button-outline" href="/Account/join.html">회원가입</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <div data-include="/includes/footer.html"></div>

    <script src="/js/include.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/form.js"></script>
    <script src="/js/account.js"></script>
</body>
</html>
