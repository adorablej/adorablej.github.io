<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Wheel Alignment Specification | Hunter Korea</title>
    <link href="/css/common.css" rel="stylesheet" />
    <link href="/css/layout.css" rel="stylesheet" />
    <link href="/css/main.css" rel="stylesheet" />
    <link href="/css/responsive.css" rel="stylesheet" />
    <link href="/css/support.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
</head>

<body>
    <!-- header -->
    <div data-include="/includes/header.html"></div>

    <!-- Page title -->
    <section class="page-heading" data-header-theme="dark">
        <div class="inner">
            <ul class="breadcrumb">
                <li><a href="/" class="breadcrumb-home" aria-label="Home"></a></li>
                <li><a href="/Support/">Support</a></li>
                <li class="current">Wheel Alignment Specification</li>
            </ul>
            <h1 class="page-title">Wheel Alignment Specification</h1>
        </div>
    </section>

    <main class="sub-specification" data-header-theme="dark">
        <section class="sub-specification-search-section">
            <div class="inner">
                <h2 class="sub-specification-heading">차량제원 검색하기<span>.</span></h2>

                <form class="sub-specification-search-form" id="specification-search-form">
                    <label class="sub-specification-label" for="specification-keyword">검색명</label>
                    <div class="sub-specification-keyword-wrap">
                        <span class="sub-specification-search-icon" aria-hidden="true"></span>
                        <input type="search" id="specification-keyword" placeholder="제조사, 차량명으로 검색어를 입력해주세요" autocomplete="off">
                    </div>

                    <div class="sub-specification-recent-row">
                        <strong>최근 검색어</strong>
                        <button type="button" class="sub-specification-recent-reset" id="recent-reset">전체 삭제</button>
                    </div>
                    <div class="sub-specification-recent-list" id="recent-search-list" aria-live="polite"></div>

                    <div class="sub-specification-filter-row">
                        <label class="sub-specification-field">
                            <span>제조사</span>
                            <select id="specification-brand-select">
                                <option value="">제조사를 선택해 주세요</option>
                            </select>
                        </label>

                        <label class="sub-specification-field">
                            <span>차종</span>
                            <select id="specification-model-select" disabled>
                                <option value="">차종을 선택해 주세요</option>
                            </select>
                        </label>

                        <button type="submit" class="sub-specification-submit">제원 찾기 요청하기</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="sub-specification-content-section">
            <div class="inner">
                <div class="sub-specification-selected-list" id="selected-list" aria-live="polite"></div>

                <section class="sub-specification-panel" id="brand-panel">
                    <div class="sub-specification-group">
                        <h3 class="sub-specification-group-title">국내 브랜드 차량<span>.</span></h3>
                        <div class="sub-specification-brand-grid" id="domestic-brand-grid"></div>
                    </div>
                    <div class="sub-specification-group">
                        <h3 class="sub-specification-group-title">수입 브랜드 차량<span>.</span></h3>
                        <div class="sub-specification-brand-grid" id="import-brand-grid"></div>
                    </div>
                </section>

                <section class="sub-specification-panel" id="model-panel" hidden>
                    <h3 class="sub-specification-group-title" id="model-panel-title">차종을 선택해 주세요<span>.</span></h3>
                    <div class="sub-specification-model-grid" id="model-grid"></div>
                </section>

                <section class="sub-specification-panel" id="result-panel" hidden>
                    <h3 class="sub-specification-group-title">차량제원 검색 결과<span>.</span></h3>
                    <div class="sub-specification-table-wrap">
                        <table class="sub-specification-table">
                            <thead>
                                <tr>
                                    <th>차량 이미지</th>
                                    <th>연식</th>
                                    <th>모델명</th>
                                    <th>Model</th>
                                    <th>세부모델명</th>
                                    <th>비고</th>
                                </tr>
                            </thead>
                            <tbody id="specification-result-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <!-- Common Banners. -->
    <div data-include="/includes/banner-roi.html" data-header-theme="light"></div>
    <div data-include="/includes/banner-solution.html" data-header-theme="light"></div>

    <!-- footer -->
    <div class="footer-section" data-header-theme="dark" data-include="/includes/footer.html"></div>

    <script src="/js/include.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/wheel-alignment-specification-data.js"></script>
    <script src="/js/wheel-alignment-specification.js"></script>
</body>

</html>
