<h3 class="sub-mypage-cs-title">CS 신청하기</h3>
<form class="sub-form sub-mypage-cs-form" data-form>
<section class="sub-mypage-cs-section">
<h4 class="sub-mypage-cs-heading">CS문의자 정보</h4>
<div class="sub-mypage-cs-fields">
<div class="sub-form-group is-filled">
<label class="sub-form-label" for="cs-company">업체명</label>
<input class="sub-form-input" id="cs-company" name="company" type="text" value="은하수타이어센터" disabled>
</div>
<div class="sub-form-group is-filled">
<label class="sub-form-label" for="cs-name">성함</label>
<input class="sub-form-input" id="cs-name" name="name" type="text" value="김은하" disabled>
</div>
<div class="sub-form-group is-filled">
<label class="sub-form-label" for="cs-phone">휴대폰 번호</label>
<input class="sub-form-input" id="cs-phone" name="phone" type="tel" value="010-1234-5678" disabled>
</div>
<div class="sub-form-group">
<label class="sub-form-label">이메일 주소</label>
<div class="sub-form-email">
<input class="sub-form-input" name="email_id" type="text" placeholder="이메일을 입력해주세요." data-required data-message="이메일을 입력해주세요.">
<span class="sub-form-email-at">@</span>
<input class="sub-form-input" id="cs-email-domain" name="email_domain" type="text" placeholder="입력해주세요." data-required data-message="이메일 도메인을 입력해주세요.">
<div class="sub-form-select" data-select data-target="#cs-email-domain">
<button type="button" class="sub-form-select-trigger" aria-expanded="false">
<span class="sub-form-select-value">직접 입력</span>
<i class="sub-form-select-arrow" aria-hidden="true"></i>
</button>
<ul class="sub-form-select-options">
<li><button type="button" class="sub-form-select-option is-selected" data-value="">직접 입력</button></li>
<li><button type="button" class="sub-form-select-option" data-value="naver.com">naver.com</button></li>
<li><button type="button" class="sub-form-select-option" data-value="gmail.com">gmail.com</button></li>
<li><button type="button" class="sub-form-select-option" data-value="daum.net">daum.net</button></li>
</ul>
<input type="hidden" name="email_domain_select" value="">
</div>
</div>
<p class="sub-form-message"></p>
</div>
</div>
</section>
<section class="sub-mypage-cs-section">
<h4 class="sub-mypage-cs-heading">CS문의자 내용</h4>
<div class="sub-mypage-cs-fields">
<div class="sub-form-group sub-mypage-cs-category">
<label class="sub-form-label">문의 분류</label>
<div class="sub-form-select" data-select>
<button type="button" class="sub-form-select-trigger" aria-expanded="false">
<span class="sub-form-select-value is-placeholder">카테고리를 선택해 주세요.</span>
<i class="sub-form-select-arrow" aria-hidden="true"></i>
</button>
<ul class="sub-form-select-options">
<li><button type="button" class="sub-form-select-option" data-value="purchase">제품/부품 구매</button></li>
<li><button type="button" class="sub-form-select-option" data-value="as">A/S 신청</button></li>
<li><button type="button" class="sub-form-select-option" data-value="transfer">제품 이전 설치</button></li>
<li><button type="button" class="sub-form-select-option" data-value="business">업무협의</button></li>
<li><button type="button" class="sub-form-select-option" data-value="training">교육문의(트레이닝 센터)</button></li>
</ul>
<input type="hidden" name="category" data-required data-message="문의 분류를 선택해주세요.">
</div>
<p class="sub-form-message"></p>
</div>
<div class="sub-form-group">
<label class="sub-form-label" for="cs-title">문의 제목</label>
<input class="sub-form-input" id="cs-title" name="title" type="text" maxlength="20" placeholder="제목을 입력해 주세요. (20자 이내)" data-required data-message="문의 제목을 입력해주세요.">
<p class="sub-form-message"></p>
</div>
<div class="sub-form-group">
<label class="sub-form-label" for="cs-message">문의 내용</label>
<div class="sub-form-textarea-wrap">
<textarea class="sub-form-textarea" id="cs-message" name="message" maxlength="3000" placeholder="문의내용을 입력해 주세요." data-required data-message="문의 내용을 입력해주세요."></textarea>
<span class="sub-form-text-count"><strong>0</strong>/3000</span>
</div>
<p class="sub-form-message"></p>
</div>
</div>
</section>
<div class="sub-mypage-cs-privacy">
<div class="sub-mypage-cs-agree sub-form-group">
<label class="sub-form-checkbox">
<input type="checkbox" name="privacy_agree" data-required data-message="개인정보 수집 및 이용에 동의해주세요.">
<span class="sub-form-checkbox-icon" aria-hidden="true"></span>
<span class="sub-form-checkbox-text"><strong>(필수)</strong> 개인정보 수집·이용에 대한 안내</span>
</label>
<p class="sub-form-message"></p>
</div>
<div class="sub-mypage-cs-privacy-content sub-form-privacy-content" data-include="/includes/privacy-inquiry.html" data-include-selector="#privacy-inquiry-content"></div>
</div>
<div class="sub-mypage-cs-submit">
<button type="submit" class="sub-form-submit">문의접수</button>
</div>
</form>
