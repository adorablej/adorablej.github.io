<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>회원가입 완료 | 헌터코리아</title>
    <link href="/css/common.css" rel="stylesheet" />
    <link href="/css/layout.css" rel="stylesheet" />
    <link href="/css/common-form.css" rel="stylesheet" />
    <link href="/css/account.css" rel="stylesheet" />
    <link href="/css/responsive.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&amp;display=swap" rel="stylesheet"/>

</head>
<body>
    <div data-include="/includes/header.html"></div>

    <main class="sub-account-page" data-header-theme="dark">
        <section class="sub-account-section sub-account-complete-section" aria-labelledby="complete-title">
            <div class="sub-account-container sub-account-complete-container">
                <h1 class="sub-account-title kr" id="complete-title">회원가입 신청 완료<span>.</span></h1>
                <div class="sub-account-complete-icon" aria-hidden="true"><img src="/images/icon/icon_complete_check.png"></div>
                <h2 class="sub-account-complete-heading"><strong id="complete-user-name">회원</strong> 님,<br class="mo-only"> 회원가입 절차가 완료되었습니다.</h2>
                <p class="sub-account-complete-text">
                    입력하신 정보의 확인까지 영업일 기준 1~2일이<br class="mo-only">
                    소요될 수 있으며,<br class="pc-only"> 해당 절차의 진행 상황은<br class="mo-only">
                    ‘마이페이지’ 에서 확인가능합니다.<br>
                    보완 필요시 고객님께 SMS으로 요청사항을<br class="mo-only">
                    전달드리니 꼭 확인 부탁드립니다.<br class="pc-only"> 회원가입 완료 시<br class="mo-only">
                    고객님께 SMS으로 전송되고 완료된 이후에<br class="mo-only">
                    헌터코리아의 모든 서비스를 이용 가능합니다.
                </p>
                <a class="sub-form-submit" href="/Account/login.html">확인</a>
            </div>
        </section>
    </main>

    <div data-include="/includes/footer.html"></div>

    <script src="/js/include.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/account.js"></script>
</body>
</html>
