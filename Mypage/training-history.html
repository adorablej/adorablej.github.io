    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">

    <link href="/css/common.css?v=20260819-2" rel="stylesheet">
    <link href="/css/layout.css?v=20260820-4" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <script src="/js/mypage-auth-guard.js?v=20260826-1"></script>
</head>
<body>
    <div data-include="/includes/header.html?v=20260820-2"></div>

    <main class="sub-mypage-page sub-mypage-training-history-page">
        <section class="page-heading">
            <div class="inner">
                <ul class="breadcrumb"><li><a class="breadcrumb-home" href="/" aria-label="Home"></a></li><li><a href="/Mypage/mypage.html">My page</a></li></ul>
                <h2 class="page-title">My page</h2>
            </div>
        </section>

        <section class="sub-mypage-section">
            <div class="sub-mypage-inner">
                <div data-include="/includes/mypage-sidebar.html?v=20260820-1" data-include-selector=".sub-mypage-sidebar" data-include-mode="replace"></div>
                <div data-include="/includes/mypage-mobile-menu.html" data-include-selector=".sub-mypage-mobile-menu" data-include-mode="replace"></div>

                <div class="sub-mypage-content sub-mypage-training-history">
                    <h3 class="sub-mypage-page-title">트레이닝 수강 이력<span class="sub-mypage-title-dot" aria-hidden="true">.</span></h3>
                    <div class="sub-mypage-training-history-table" role="table" aria-label="트레이닝 수강 이력">
                        <div class="sub-mypage-training-history-head" role="row">
                            <strong role="columnheader">수강일자</strong><strong role="columnheader">수강제목</strong><strong role="columnheader">수강상태</strong><strong role="columnheader">상세</strong>
                        </div>
                        <div class="sub-mypage-training-history-body" data-training-history-list aria-live="polite">
                            <p class="sub-mypage-list-empty">수강 이력을 불러오는 중입니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-layer sub-training-modal" id="training-history-modal" aria-hidden="true">
        <button type="button" class="modal-dim sub-training-modal-dim" data-training-history-close aria-label="상세 창 닫기"></button>
        <div class="modal-box modal-box--media sub-training-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="training-history-modal-title">
            <button type="button" class="modal-close-button sub-training-modal-close" data-training-history-close aria-label="상세 창 닫기"></button>
            <div class="modal-media sub-training-modal-visual" aria-hidden="true"></div>
            <div class="modal-content sub-training-modal-body">
                <div class="sub-training-modal-summary">
                    <strong class="sub-training-modal-datetime" id="training-history-modal-title" data-history-modal-date></strong>
                    <div class="sub-training-modal-course-row">
                        <div class="sub-training-modal-course"><i class="sub-training-modal-course-dot" data-history-modal-dot aria-hidden="true"></i><span data-history-modal-course></span></div>
                        <div class="sub-training-modal-info"><span data-history-modal-instructor></span><span data-history-modal-fee></span></div>
                    </div>
                </div>
                <div class="sub-training-modal-actions"><button type="button" class="sub-training-modal-cancel" data-training-history-close>닫기</button><button type="button" class="sub-training-modal-submit" data-training-history-cancel>신청 취소하기</button></div>
            </div>
        </div>
    </div>

    <div class="footer-section" data-include="/includes/footer.html"></div>

    <script src="/js/api/front-api.js?v=20260821"></script>
    <script src="/js/main.js?v=20260814"></script>
    <script src="/js/form.js?v=20260814"></script>
    <script src="/js/mypage.js?v=20260824-5"></script>
    <script src="/js/training-history.js?v=20260821"></script>
</body>
</html>
