<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hunter Korea | Hunter Engineering Company®</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">

    <link href="/css/main.css?v=20260814" rel="stylesheet"/>
    <link href="/css/products.css?v=20260814" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&amp;display=swap" rel="stylesheet"/>
</head>
<body>
<!-- header -->
<div data-include="../includes/header.html"></div>
<main class="products-page">
<!-- Page title -->
<section class="page-heading">
<div class="inner">
<ul class="breadcrumb">
<li>
<a aria-label="Home" class="breadcrumb-home" href="/"></a>
</li>
<li>
<a href="/Products/products.html">Products</a>
</li>
<li>
<a href="#">Contact</a>
</li>
</ul>
<h2 class="page-title">Contact</h2>
</div>
</section>
<form class="sub-form-page sub-form-page-contact" id="contact-form" data-form novalidate>
<div class="sub-form-contact-heading">
<h2>CS 신청하기<span>.</span></h2>
</div>
<!-- Customer Information -->
<section class="sub-form-section">
<div class="inner">
<div class="sub-form-section-title">
<h3>CS문의자 정보<span>.</span></h3>
</div>
<div class="sub-form">
<div class="sub-form-group">
<label class="sub-form-label" for="company">
                                업체명<span class="sub-form-required">*</span>
                            </label>
<div class="sub-form-control"><input autocomplete="organization" class="sub-form-input" data-message="업체명을 입력해주세요." data-required="" id="company" name="company_name" placeholder="업체명을 입력해주세요." type="text"/><span aria-hidden="true" class="sub-form-state"></span></div>
<p class="sub-form-message">
                                업체명을 입력해주세요.
                            </p>
</div>
<div class="sub-form-group">
<label class="sub-form-label" for="name">
                                성함<span class="sub-form-required">*</span>
                            </label>
<div class="sub-form-control"><input autocomplete="name" class="sub-form-input" data-message="성함을 입력해주세요." data-required="" id="name" name="user_name" placeholder="성함을 입력해주세요." type="text"/><span aria-hidden="true" class="sub-form-state"></span></div>
<p class="sub-form-message">
                                성함을 입력해주세요.
                            </p>
</div>
<div class="sub-form-group">
<label class="sub-form-label" for="phone-number">
                                휴대폰 번호<span class="sub-form-required">*</span>
                            </label>
<div class="sub-form-control"><input autocomplete="tel" class="sub-form-input" data-message="휴대폰 번호를 확인해주세요." data-pattern="^01[016789]-\d{3,4}-\d{4}$" data-phone data-required="" id="phone-number" inputmode="numeric" maxlength="13" name="user_phone" placeholder="(-) 제외한 숫자만 입력해 주세요." type="tel"/><span aria-hidden="true" class="sub-form-state"></span></div>
<p class="sub-form-message">
                                휴대폰 번호를 확인해주세요.
                            </p>
</div>
<div class="sub-form-group">
<span class="sub-form-label">
                                이메일 주소
                            </span>
<div class="sub-form-email">
<div class="sub-form-control"><input autocomplete="email" class="sub-form-input" data-message="이메일 주소를 확인해주세요." data-pattern="^[^@\\s]+$" id="email-id" name="email_id" placeholder="이메일을 입력해주세요." type="text"/><span aria-hidden="true" class="sub-form-state"></span></div>
<span class="sub-form-email-at">@</span>
<div class="sub-form-control"><input class="sub-form-input" data-message="이메일 주소를 확인해주세요." data-pattern="^[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$" id="email-domain" name="email_domain" placeholder="입력해주세요." type="text"/><span aria-hidden="true" class="sub-form-state"></span></div>
<div class="sub-form-select" data-select="" data-target="#email-domain">
<button aria-expanded="false" aria-haspopup="listbox" class="sub-form-select-trigger" type="button">
<span class="sub-form-select-value is-placeholder">
                                            직접 입력
                                        </span>
<span aria-hidden="true" class="sub-form-select-arrow"></span>
</button>
<ul class="sub-form-select-options" role="listbox">
<li>
<button class="sub-form-select-option is-selected" data-value="" type="button">
                                                직접 입력
                                            </button>
</li>
<li>
<button class="sub-form-select-option" data-value="naver.com" type="button">
                                                naver.com
                                            </button>
</li>
<li>
<button class="sub-form-select-option" data-value="gmail.com" type="button">
                                                gmail.com
                                            </button>
</li>
<li>
<button class="sub-form-select-option" data-value="daum.net" type="button">
                                                daum.net
                                            </button>
</li>
</ul>
<input name="email_domain_select" type="hidden" value=""/>
</div>
</div>
<p class="sub-form-message">
                                이메일 주소를 확인해주세요.
                            </p>
</div>
</div>
</div>
</section>
<!-- Inquiry Details -->
<section class="sub-form-section">
<div class="inner">
<div class="sub-form-section-title">
<h3>CS문의 내용<span>.</span></h3>
</div>
<div class="sub-form">
<div class="sub-form-group sub-form-category-group">
<span class="sub-form-label">
                                문의 유형<span class="sub-form-required">*</span>
                            </span>
<div class="sub-form-select" data-select="">
<button aria-expanded="false" aria-haspopup="listbox" class="sub-form-select-trigger" type="button">
<span class="sub-form-select-value is-placeholder">
                                        카테고리를 선택해 주세요.
                                    </span>
<span aria-hidden="true" class="sub-form-select-arrow"></span>
</button>
<ul class="sub-form-select-options" role="listbox">
<li>
<button class="sub-form-select-option" data-value="purchase" type="button">
                                            제품/부품 구매
                                        </button>
</li>
<li>
<button class="sub-form-select-option" data-value="as" type="button">
                                            A/S 신청
                                        </button>
</li>
<li>
<button class="sub-form-select-option" data-value="transfer" type="button">
                                            제품 이전 설치
                                        </button>
</li>
<li>
<button class="sub-form-select-option" data-value="business" type="button">
                                            업무협의
                                        </button>
</li>
<li>
<button class="sub-form-select-option" data-value="training" type="button">
                                            교육문의(트레이닝 센터)
                                        </button>
</li>
</ul>
<input data-message="문의 유형을 선택해주세요." data-required="" name="inquiry_category" type="hidden" value=""/>
</div>
<p class="sub-form-message">
                                문의 유형을 선택해주세요.
                            </p>
</div>
<div class="sub-form-group">
<label class="sub-form-label" for="inquiry-title">
                                문의 제목<span class="sub-form-required">*</span>
                            </label>
<div class="sub-form-control"><input class="sub-form-input" data-message="문의 제목을 입력해주세요." data-required="" id="inquiry-title" maxlength="20" name="inquiry_title" placeholder="제목을 입력해 주세요. (20자 이내)" type="text"/><span aria-hidden="true" class="sub-form-state"></span></div>
<p class="sub-form-message">
                                문의 제목을 입력해주세요.
                            </p>
</div>
<div class="sub-form-group">
<label class="sub-form-label" for="inquiry-content">
                                문의 내용<span class="sub-form-required">*</span>
                            </label>
<div class="sub-form-textarea-wrap">
<div class="sub-form-control"><textarea class="sub-form-textarea" data-message="문의 내용을 입력해주세요." data-required="" id="inquiry-content" maxlength="3000" name="message" placeholder="문의 내용을 입력해 주세요."></textarea><span aria-hidden="true" class="sub-form-state"></span></div>
<span class="sub-form-text-count">
<strong>0</strong>/3000
                                </span>
</div>
<p class="sub-form-message">
                                문의 내용을 입력해주세요.
                            </p>
</div>
<div class="sub-form-bottom">
<div class="sub-form-privacy">
<div class="sub-form-group sub-form-agree-group">
<label class="sub-form-checkbox">
<input data-message="개인정보 수집 및 이용에 동의해주세요." data-required="" id="agree-check" name="agree" type="checkbox"/>
<span aria-hidden="true" class="sub-form-checkbox-icon"></span>
<span class="sub-form-checkbox-text">
                                        (필수) 개인정보 수집·이용에 대한 안내
                                    </span>
</label>
<p class="sub-form-message">
                                    개인정보 수집 및 이용에 동의해주세요.
</p>
</div>
<div class="sub-form-privacy-content" data-include="/includes/privacy-inquiry.html" data-include-selector="#privacy-inquiry-content"></div>
</div>
<div class="sub-form-submit-row">
<button class="sub-form-submit" type="submit">
                                문의접수
                            </button>
</div>
</div>
</div>
</div>
</section>
</form>
</main>
<!-- footer -->
<div class="footer-section" data-include="../includes/footer.html"></div>

<script src="/js/form.js?v=20260814"></script>
<script src="/js/main.js?v=20260814"></script>
<script src="/js/products.js?v=20260814"></script>
</body>
</html>
