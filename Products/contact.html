<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        헌터페이지
    </title>
    <link href="/css/common.css" rel="stylesheet" />
    <link href="/css/layout.css" rel="stylesheet" />
    <link href="/css/main.css" rel="stylesheet" />
    <link href="/css/products.css" rel="stylesheet" />
    <link href="/css/responsive.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

</head>

<body>
    <!-- header -->
    <div data-include="../includes/header.html"></div>
    
    

        <!-- ========================================
        Main
        ========================================= -->
        <main id="main" class="products-page">

            <!-- Page title -->
            <section class="page-heading"  data-header-theme="dark">
                <div class="inner">
                    <ul class="breadcrumb">
                        <li>
                            <a href="/" class="breadcrumb-home" aria-label="Home"></a>
                        </li>
                        <li>
                            <a href="#">Products</a>
                        </li>
                        <li>
                            <a href="#">Contact</a>
                        </li>
                        <!--  <li class="current">
                            depth3
                        </li> -->
                    </ul>
                    <h2 class="page-title">
                        Contact
                    </h2>
                </div>
            </section>


            <!-- Customer Information. -->
            <section class="contact-form-section">

                <div class="inner">

                    <div class="contact-section-title">
                        <h3>CS문의자 정보<span>.</span></h3>
                    </div>

                    <div class="contact-form">

                        <!-- 업체명 -->
                        <div class="contact-form-group">
                            <label class="contact-label" for="company">
                                업체명
                            </label>

                            <input
                                type="text"
                                id="company"
                                class="contact-input"
                                placeholder="업체명을 입력해주세요."
                            >
                        </div>

                        <!-- 성함 -->
                        <div class="contact-form-group">
                            <label class="contact-label" for="name">
                                성함
                            </label>

                            <input
                                type="text"
                                id="name"
                                class="contact-input"
                                placeholder="성함을 입력해주세요."
                            >
                        </div>

                        <!-- 휴대폰 -->
                        <div class="contact-form-group">

                            <label class="contact-label">
                                휴대폰 번호
                            </label>

                            <div class="contact-phone">

                                <select class="contact-select">
                                    <option>010</option>
                                    <option>011</option>
                                    <option>016</option>
                                    <option>017</option>
                                </select>

                                <input
                                    type="text"
                                    class="contact-input"
                                    placeholder="숫자만 입력해주세요."
                                >

                            </div>

                        </div>

                        <!-- 이메일 -->
                        <div class="contact-form-group">

                            <label class="contact-label">
                                이메일 주소
                            </label>

                            <div class="contact-email">

                                <input
                                    type="text"
                                    class="contact-input"
                                    placeholder="입력해주세요."
                                >

                                <span class="contact-email-at">@</span>

                                <input
                                    type="text"
                                    class="contact-input"
                                    placeholder="입력해주세요."
                                >

                                <select class="contact-select">
                                    <option>직접 입력</option>
                                    <option>naver.com</option>
                                    <option>gmail.com</option>
                                    <option>daum.net</option>
                                </select>

                            </div>

                        </div>

                    </div>

                </div>

            </section>


            <!-- Inquiry Details. -->
            <section class="contact-inquiry-section">
                <div class="inner">
                    <div class="contact-section-title">
                        <h3>CS문의 내용<span>.</span></h3>
                    </div>

                    <div class="contact-form">
                        <div class="contact-form-group">
                            <label class="contact-label" for="inquiry-category">업체명</label>

                            <select id="inquiry-category" class="contact-select">
                                <option value="">카테고리를 선택해 주세요.</option>
                                <option value="product">제품 문의</option>
                                <option value="service">서비스 문의</option>
                                <option value="education">교육 문의</option>
                                <option value="etc">기타 문의</option>
                            </select>
                        </div>

                        <div class="contact-form-group">
                            <label class="contact-label" for="inquiry-title">문의 제목</label>

                            <input
                                type="text"
                                id="inquiry-title"
                                class="contact-input"
                                maxlength="20"
                                placeholder="제목을 입력해 주세요. (20자 이내)"
                            >
                        </div>

                        <div class="contact-form-group">
                            <label class="contact-label" for="inquiry-content">문의 내용</label>

                            <div class="contact-textarea-wrap">
                                <textarea
                                    id="inquiry-content"
                                    class="contact-textarea"
                                    maxlength="3000"
                                ></textarea>

                                <span class="contact-text-count">
                                    <strong>0</strong>/3000
                                </span>
                            </div>
                        </div>

                        <div class="contact-form-bottom">
                            <label class="contact-agree">
                                <input type="checkbox" checked>
                                <span class="contact-agree-icon" aria-hidden="true"></span>
                                <span class="contact-agree-text">개인정보 수집 및 이용에 동의합니다</span>
                            </label>

                            <button type="submit" class="contact-submit">
                                문의접수
                            </button>
                        </div>
                    </div>
                </div>
            </section>




        </main>


    <!-- footer -->
    <div class="footer-section" data-header-theme="dark" data-include="../includes/footer.html"></div>

    
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.8/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/js/include.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/products.js"></script>
</body>

</html>
