<head>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <link href="/css/common.css?v=20260814" rel="stylesheet" />
    <link href="/css/layout.css?v=20260814" rel="stylesheet" />
    <link href="/css/main.css?v=20260814" rel="stylesheet" />

<body>
    <!-- header -->
    <div data-include="/includes/header.html"></div>
    
    

    <main id="main" class="OEM-page">
        <section class="page-heading" data-header-theme="dark">
            <div class="inner">
                <ul class="breadcrumb">
                    <li><a href="/" class="breadcrumb-home" aria-label="Home"></a></li>
                    <li><a href="/Media//media.html">Media</a></li>
                    <li><a href="#" id="mediaBreadcrumb">Archive</a></li>
                </ul>
                <h2 class="page-title" id="mediaPageTitle">Archive</h2>
            </div>
        </section>

        <section class="sub-media-list-section">
            <div class="inner">
                <div class="sub-media-filter">
                    <div class="sub-pill-tabs" id="mediaFilter"></div>
                    <div class="sub-form-select" data-select id="mediaFilterSelect">
                        <button
                            type="button"
                            class="sub-form-select-trigger"
                            aria-expanded="false"
                            aria-haspopup="listbox"
                            aria-label="카테고리 선택"
                        >
                            <span class="sub-form-select-value">전체</span>
                            <span class="sub-form-select-arrow" aria-hidden="true"></span>
                        </button>
                        <ul class="sub-form-select-options" role="listbox"></ul>
                        <input type="hidden" id="mediaFilterValue" value="전체">
                    </div>
                </div>
                <div class="sub-media-list" id="mediaList"></div>
                <nav class="sub-pagination sub-media-pagination" id="mediaPagination" aria-label="미디어 목록 페이지 이동" hidden></nav>
            </div>
        </section>
    </main>



    <!-- footer -->
    <div class="footer-section" data-header-theme="dark" data-include="/includes/footer.html"></div>
