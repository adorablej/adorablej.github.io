<body>
    <div data-include="/includes/header.html"></div>

    <main class="sub-mypage-page sub-mypage-training-page">
        <section class="page-heading">
            <div class="inner">
                <ul class="breadcrumb">
                    <li><a class="breadcrumb-home" href="/" aria-label="Home"></a></li>
                    <li><a href="/Mypage/mypage.html">My page</a></li>
                </ul>
                <h2 class="page-title">My page</h2>
            </div>
        </section>

        <section class="sub-mypage-section">
            <div class="sub-mypage-inner">
                <div data-include="/includes/mypage-sidebar.html?v=20260820-1" data-include-selector=".sub-mypage-sidebar" data-include-mode="replace"></div>
                <div data-include="/includes/mypage-mobile-menu.html" data-include-selector=".sub-mypage-mobile-menu" data-include-mode="replace"></div>

                <div class="sub-mypage-content sub-mypage-training">
                    <h3 class="sub-mypage-page-title"><span class="pc-only">트레이닝 교육 신청<span class="sub-mypage-title-dot" aria-hidden="true">.</span></span><span class="mo-only">트레이닝 수강 신청<span class="sub-mypage-title-dot" aria-hidden="true">.</span></span></h3>
                    <section class="sub-mypage-training-schedule" aria-labelledby="training-schedule-title">
                        <h4 id="training-schedule-title" class="sub-mypage-training-heading">교육일정</h4>
                        <div class="sub-training-calendar-wrap">
                            <div class="sub-training-calendar-head">
                                <button type="button" class="sub-training-month-btn sub-training-month-prev" aria-label="이전 달"></button>
                                <h3 class="sub-training-month-title"></h3>
                                <button type="button" class="sub-training-month-btn sub-training-month-next" aria-label="다음 달"></button>
                            </div>
                            <div class="sub-training-week"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
                            <div class="sub-training-calendar" id="training-calendar" data-training-view="mypage"></div>
                        </div>
                        <div class="sub-mypage-training-list" id="training-list" aria-live="polite"></div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-layer sub-training-modal" id="training-modal" aria-hidden="true">
        <button type="button" class="modal-dim sub-training-modal-dim" data-training-close aria-label="모달 닫기"></button>
        <div class="modal-box modal-box--media sub-training-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="training-modal-title">
            <button type="button" class="modal-close-button sub-training-modal-close" data-training-close aria-label="모달 닫기"></button>
            <div class="sub-training-modal-content"></div>
        </div>

    <div data-include="/includes/banner-roi.html"></div>

    <div class="footer-section" data-include="/includes/footer.html"></div>
