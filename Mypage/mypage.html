<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hunter Korea | Hunter Engineering Company®</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">

    <link href="/css/common.css?v=20260819-2" rel="stylesheet" />
    <link href="/css/layout.css?v=20260820-4" rel="stylesheet" />
    <link href="/css/main.css?v=20260820-1" rel="stylesheet" />
    <link href="/css/support.css?v=20260814" rel="stylesheet" />
    <link href="/css/mypage.css?v=20260823-3" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&amp;display=swap" rel="stylesheet"/>
</head>


<body>
    <div data-include="/includes/header.html?v=20260820-2"></div>

    <main class="sub-mypage-page sub-mypage-home-page">
        <section class="page-heading">
            <div class="inner">
                <ul class="breadcrumb">
                    <li><a href="/" class="breadcrumb-home" aria-label="Home"></a></li>
                    <li><a href="/Mypage/mypage.html">My page</a></li>
                </ul>
                <h2 class="page-title">My page</h2>
            </div>
        </section>

        <section class="sub-mypage-section">
            <div class="sub-mypage-inner">
                <div data-include="/includes/mypage-sidebar.html?v=20260822" data-include-selector=".sub-mypage-sidebar" data-include-mode="replace"></div>

                <div data-include="/includes/mypage-mobile-menu.html" data-include-selector=".sub-mypage-mobile-menu" data-include-mode="replace"></div>

                <div class="sub-mypage-content">
                    <section class="sub-mypage-info-section">
                        <h3 class="sub-mypage-section-title">계정/회원정보<span class="sub-mypage-title-dot" aria-hidden="true">.</span></h3>
                        <dl class="sub-mypage-info-list">
                            <div><dt>이름</dt><dd id="mypageMemberName">-</dd></div>
                            <div><dt>휴대폰번호</dt><dd id="mypageMemberPhone">-</dd></div>
                        </dl>
                    </section>

                    <section class="sub-mypage-info-section">
                        <h3 class="sub-mypage-section-title">기업/사업체 정보<span class="sub-mypage-title-dot" aria-hidden="true">.</span></h3>
                        <dl class="sub-mypage-info-list">
                            <div><dt>이름</dt><dd id="mypageBusinessName">-</dd></div>
                            <div><dt>사업자 등록번호</dt><dd id="mypageBusinessNumber">-</dd></div>
                            <div><dt>대표자명</dt><dd id="mypageBusinessRepresentative">-</dd></div>
                            <div><dt>사업장 주소</dt><dd id="mypageBusinessAddress">-</dd></div>
                        </dl>
                    </section>

                    <section class="sub-mypage-block sub-mypage-product-block">
                        <div class="sub-mypage-block-heading">
                            <h3 class="sub-mypage-section-title">나의 제품 목록<span class="sub-mypage-title-dot" aria-hidden="true">.</span></h3>
                            <a href="/Mypage/products.html">더보기</a>
                        </div>

                        <div class="sub-mypage-list-region" data-mypage-list data-item-selector=".sub-mypage-product-card">
                        <div class="sub-mypage-product-slider-wrap">
                            <button type="button" class="sub-mypage-slider-button sub-mypage-product-prev" aria-label="이전 제품"></button>
                            <div class="swiper sub-mypage-product-slider">
                                <div class="swiper-wrapper" id="mypageProductList"></div>
                            </div>
                            <button type="button" class="sub-mypage-slider-button sub-mypage-product-next" aria-label="다음 제품"></button>
                        </div>
                        <p class="sub-mypage-list-empty" data-mypage-empty hidden>보유중인 헌터 제품이 없습니다.</p>
                        </div>
                    </section>

                    <section class="sub-mypage-block sub-mypage-order-block">
                        <div class="sub-mypage-block-heading">
                            <h3 class="sub-mypage-section-title">부품 주문 신청 내역<span class="sub-mypage-title-dot" aria-hidden="true">.</span></h3>
                            <a href="/Mypage/order-list.html">더보기</a>
                        </div>

                        <div class="sub-mypage-list-region" data-mypage-list data-item-selector=".sub-mypage-order-history">
                        <div id="mypageOrderList"></div>
                        <p class="sub-mypage-list-empty" data-mypage-empty hidden>부품 주문 신청 내역이 없습니다.</p>
                        </div>
                    </section>

                    <section class="sub-mypage-block sub-mypage-training-block">
                        <div class="sub-mypage-block-heading">
                            <h3 class="sub-mypage-section-title">트레이닝 수강 이력<span class="sub-mypage-title-dot" aria-hidden="true">.</span></h3>
                            <a href="/Mypage/training-history.html">더보기</a>
                        </div>
                        <div class="sub-mypage-list-region" data-mypage-list data-item-selector="tbody tr">
                        <div class="sub-mypage-table-wrap">
                            <table class="sub-mypage-table">
                                <thead>
                                    <tr><th>수강일자</th><th>수강제목</th><th>수강상태</th><th>상세</th></tr>
                                </thead>
                                <tbody id="mypageTrainingList"></tbody>
                            </table>
                        </div>
                        <p class="sub-mypage-list-empty" data-mypage-empty hidden>트레이닝 수강 이력이 없습니다.</p>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-layer sub-training-modal" id="mypage-home-training-modal" aria-hidden="true">
        <button type="button" class="modal-dim sub-training-modal-dim" data-home-training-close aria-label="상세 창 닫기"></button>
        <div class="modal-box modal-box--media sub-training-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="mypage-home-training-modal-title">
            <button type="button" class="modal-close-button sub-training-modal-close" data-home-training-close aria-label="상세 창 닫기"></button>
            <div class="modal-media sub-training-modal-visual" aria-hidden="true"></div>
            <div class="modal-content sub-training-modal-body">
                <div class="sub-training-modal-summary">
                    <strong class="sub-training-modal-datetime" id="mypage-home-training-modal-title" data-home-training-date></strong>
                    <div class="sub-training-modal-course"><i class="sub-training-modal-course-dot" data-home-training-dot aria-hidden="true"></i><span data-home-training-course></span></div>
                </div>
                <div class="sub-training-modal-actions"><button type="button" class="sub-training-modal-cancel" data-home-training-close>닫기</button><button type="button" class="sub-training-modal-submit" data-home-training-cancel>신청 취소하기</button></div>
            </div>
        </div>
    </div>

    <div data-include="/includes/footer.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/js/include.js?v=20260814"></script>
    <script src="/js/common.js?v=20260814"></script>
    <script src="/js/mypage.js?v=20260823-2"></script>
    <script src="/js/api/config.js?v=20260820"></script>
    <script src="/js/api/client.js?v=20260820"></script>
    <script src="/js/api/front-api.js?v=20260820"></script>
    <script src="/js/mypage-home.js?v=20260824"></script>
</body>
</html>
