        <!-- ========================================
        Main
        ========================================= -->
        <main id="main" class="OEM-page">

            <!-- Page title -->
            <section class="page-heading"  data-header-theme="dark">
                <div class="inner">
                    <ul class="breadcrumb">
                        <li>
                            <a href="/" class="breadcrumb-home" aria-label="Home"></a>
                        </li>
                        <li>
                            <a href="#">Media</a>
                        </li>
                        <!-- <li>
                            <a href="#">depth2</a>
                        </li>
                        <li class="current">
                            depth3
                        </li> -->
                    </ul>
                    <h2 class="page-title">
                        Media
                    </h2>
                </div>
            </section>

        </main>


        <!-- media-archive -->
        <section class="media-archive">
            <div class="inner">
                <div class="media-archive-heading">
                    <h3 class="media-archive-title">Archive<span>.</span></h3>
                    <a href="/Media/media-list.html?type=archive" class="sub-button-more">more</a>
                </div>
        
                <div class="media-archive-list" id="mediaMainArchiveList"></div>
            </div>
        </section>

        <!-- media-news -->
        <section class="media-news">
            <div class="inner">
                <div class="media-news-heading">
                    <h3 class="media-news-title">News<span>.</span></h3>
                    <a href="/Media/media-list.html?type=news" class="sub-button-more">more</a>
                </div>
        
                <div class="media-news-list" id="mediaMainNewsList"></div>
            </div>
        </section>


         <!-- Section 05 : Media -->
         <section id="section-media" class="main-section media-section" data-header-theme="dark">
            <div class="media-inner">
                <div class="media-page-heading">
                    <h2 class="media-page-title">Promotion &amp; Event<span>.</span></h2>
                    <a href="/Media/media-list.html?type=promotion" class="sub-button-more">more</a>
                </div>

                <div class="media-content">
                    <a href="#" class="media-featured" id="mediaMainFeatured">
                        <div class="media-featured-image">
                            <img id="mediaMainFeaturedImage" src="/images/common/img_placeholder.jpg" alt="">
                        </div>
                        <div class="media-featured-content">
                            <span class="media-card-category" id="mediaMainFeaturedCategory"></span>
                            <h3 class="media-card-title" id="mediaMainFeaturedTitle"></h3>
                            <p class="media-card-text" id="mediaMainFeaturedText"></p>
                        </div>
                    </a>

                    <div class="media-list" id="mediaMainPromotionList"></div>
                </div>
            </div>
        </section>

    <!-- footer -->
    <div class="footer-section" data-header-theme="dark" data-include="/includes/footer.html"></div>

    
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.8/dist/lenis.min.js"></script>
