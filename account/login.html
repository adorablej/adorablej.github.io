<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hunter Korea | Hunter Engineering Company®</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">

    <link href="/css/common.css?v=20260819-2" rel="stylesheet" />
    <link href="/css/layout.css?v=20260820-4" rel="stylesheet" />
    <link href="/css/common-form.css?v=20260814" rel="stylesheet" />
    <link href="/css/account.css?v=20260820-6" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&amp;display=swap" rel="stylesheet"/>

</head>
<body>
    <div data-include="/includes/header.html?v=20260820-2"></div>

    <main class="sub-account-page">
        <section class="sub-account-section sub-account-login-section" aria-labelledby="login-title">
            <div class="sub-account-container sub-account-container-small">
                <h1 class="sub-account-title" id="login-title">Login<span>.</span></h1>

                <form class="sub-form sub-account-form sub-account-phone-login" id="login-form" novalidate>
                    <div class="sub-account-login-step is-active" data-login-step="phone">
                    <div class="sub-form-group sub-account-field">
                        <label class="sub-account-label" for="login-phone">휴대전화번호</label>
                        <input
                            class="sub-form-input sub-account-input"
                            id="login-phone"
                            name="phone"
                            type="tel"
                            inputmode="numeric"
                            autocomplete="tel"
                            maxlength="11"
                            placeholder="(-) 제외한 숫자만 입력해 주세요."
                            data-required
                            data-message="휴대전화번호를 입력해 주세요."
                        />
                        <p class="sub-form-message sub-account-error" aria-live="polite"></p>
                    </div>

                    <label class="sub-form-checkbox sub-account-login-check">
                        <input id="login-keep" name="keepLogin" type="checkbox" />
                        <span class="sub-form-checkbox-icon" aria-hidden="true"></span>
                        <span class="sub-form-checkbox-text">로그인 상태 유지</span>
                    </label>

                    <div class="sub-account-actions"><button class="sub-account-button sub-account-button-primary" type="button" data-login-request>로그인 코드 요청하기</button></div>
                    </div>

                    <div class="sub-account-login-step" data-login-step="code" hidden>
                        <div class="sub-form-group sub-account-field sub-account-code-field">
                            <label class="sub-account-label" for="login-code">휴대전화번호</label>
                            <div class="sub-account-code-input-wrap"><input class="sub-form-input sub-account-input" id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="인증코드 입력"><span class="sub-account-code-timer" data-login-timer>09:59</span></div>
                            <div class="sub-account-code-feedback"><p class="sub-account-code-status" data-login-status hidden aria-live="polite"></p><button class="sub-account-code-resend" type="button" data-login-resend>코드 재전송</button></div>
                        </div>

                        <label class="sub-form-checkbox sub-account-login-check"><input id="login-keep-code" name="keepLoginCode" type="checkbox"><span class="sub-form-checkbox-icon" aria-hidden="true"></span><span class="sub-form-checkbox-text">로그인 상태 유지</span></label>
                        <div class="sub-account-actions sub-account-login-code-actions"><button class="sub-account-button sub-account-button-outline" type="button" data-login-back>이전</button><button class="sub-account-button sub-account-button-primary" type="submit" data-login-submit disabled>로그인</button></div>
                    </div>

                    <a class="sub-account-login-join" href="/account/join.html">회원가입</a>
                </form>
            </div>
        </section>
    </main>

    <div data-include="/includes/footer.html"></div>

    <script src="/js/include.js?v=20260814"></script>
    <script src="/js/common.js?v=20260814"></script>
    <script src="/js/api/config.js?v=20260821"></script>
    <script src="/js/api/client.js?v=20260821"></script>
    <script src="/js/api/front-api.js?v=20260822"></script>
    <script src="/js/form.js?v=20260821"></script>
    <script src="/js/account.js?v=20260822-2"></script>
</body>
</html>
